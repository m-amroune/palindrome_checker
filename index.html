<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>
    


<h1>Is it a Palindrome ?</h1>

<div id="container">
    <label>Enter in text to check for a palindrome :</label>
    <input id="text-input" />
    <button id="check-btn" >Check</button>
    <p id="result"></p>
</div>

<div id="container-definition">
<p id="definition"> <i class="fa-solid fa-lightbulb"></i>  A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
</div>

    
    <script src="index.js"></script>
</body>
</html>
